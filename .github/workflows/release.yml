name: Release assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c "from emerald_shore import __version__; print(__version__)")
          test "${GITHUB_REF_NAME}" = "v${version}"
      - name: Test and build
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_skill.py .
          python scripts/run_static_eval.py
          python scripts/build_release.py --check
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            dist/emerald-shore-postgraduate-exam-coach-${GITHUB_REF_NAME}.zip \
            dist/emerald-shore-postgraduate-exam-coach-${GITHUB_REF_NAME}.zip.sha256 \
            --clobber
