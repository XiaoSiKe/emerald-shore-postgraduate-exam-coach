name: 持续集成

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.9"
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: 安装可选 PDF 解析器
        run: python -m pip install pypdf
      - name: 编译检查
        run: python -m compileall -q emerald_shore emerald.py scripts tests
      - name: 单元与集成测试
        run: python -m unittest discover -s tests -v
      - name: 校验 Skill
        run: python scripts/validate_skill.py .
      - name: 静态行为契约
        run: python scripts/run_static_eval.py
      - name: 可重复发布包
        run: python scripts/build_release.py --check

  smoke-bundle:
    name: 安装包冒烟测试
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/build_release.py
      - name: 验证解压后的 Skill
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/emerald-shore-install /tmp/emerald-shore-study
          unzip -q dist/emerald-shore-postgraduate-exam-coach-v0.4.0.zip -d /tmp/emerald-shore-install
          cd /tmp/emerald-shore-install/emerald-shore-postgraduate-exam-coach
          exam_date=$(date -d "+90 days" +%F)
          python emerald.py --version
          python emerald.py init /tmp/emerald-shore-study --exam-date "$exam_date" --daily-hours 4 --target-school 示例大学 --target-major 计算机科学与技术
          python emerald.py routine set /tmp/emerald-shore-study --weekday-hours 4 --weekend-hours 8 --sleep-floor-hours 7 --preferred-place 图书馆三楼 --fixed-commitment 周三实验课
          python emerald.py subject add /tmp/emerald-shore-study --name 数学 --max-score 150 --baseline 70 --target 110 --kind calculation --code 301
          python emerald.py topic add /tmp/emerald-shore-study --subject 数学 --name 微积分 --chapter 高等数学 --weight 3 --mastery 0.3
          python -c "from pathlib import Path; Path('/tmp/emerald-shore-paper.md').write_text('第1题 求极限。', encoding='utf-8')"
          python emerald.py ingest /tmp/emerald-shore-study /tmp/emerald-shore-paper.md --evidence-level target_school_open --classification-confidence high --subject 数学 --topic 微积分 --match-note "示例大学、科目代码 301、公开样题、2025 年"
          python emerald.py plan /tmp/emerald-shore-study
          python emerald.py drill /tmp/emerald-shore-study --subject 数学 --topic 微积分
          python emerald.py weekly /tmp/emerald-shore-study
