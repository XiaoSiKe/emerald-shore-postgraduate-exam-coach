name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.9"
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install optional PDF parser
        run: python -m pip install pypdf
      - name: Compile
        run: python -m compileall -q emerald_shore emerald.py scripts tests
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Validate Skill
        run: python scripts/validate_skill.py .
      - name: Static behavior contracts
        run: python scripts/run_static_eval.py
      - name: Reproducible release
        run: python scripts/build_release.py --check

  smoke-bundle:
    name: Installed bundle smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/build_release.py
      - name: Smoke test extracted Skill
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/emerald-shore-install /tmp/emerald-shore-study
          unzip -q dist/emerald-shore-postgraduate-exam-coach-v0.2.0.zip -d /tmp/emerald-shore-install
          cd /tmp/emerald-shore-install/emerald-shore-postgraduate-exam-coach
          exam_date=$(date -d "+90 days" +%F)
          python emerald.py --version
          python emerald.py init /tmp/emerald-shore-study --exam-date "$exam_date" --daily-hours 4
          python emerald.py subject add /tmp/emerald-shore-study --name 数学 --max-score 150 --baseline 70 --target 110 --kind calculation
          python emerald.py topic add /tmp/emerald-shore-study --subject 数学 --name 微积分 --weight 3 --mastery 0.3
          python emerald.py plan /tmp/emerald-shore-study
          python emerald.py weekly /tmp/emerald-shore-study
