name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.9"
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install optional PDF parser
        run: python -m pip install pypdf
      - name: Compile
        run: python -m compileall -q qingan qingan.py scripts tests
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Validate Skill
        run: python scripts/validate_skill.py .
      - name: Static behavior contracts
        run: python scripts/run_static_eval.py
      - name: Reproducible release
        run: python scripts/build_release.py --check

  smoke-bundle:
    name: Installed bundle smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/build_release.py
      - name: Smoke test extracted Skill
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/qingan-install /tmp/qingan-study
          unzip -q dist/qingan-kaoyan-coach-v0.1.0.zip -d /tmp/qingan-install
          cd /tmp/qingan-install/qingan-kaoyan-coach
          exam_date=$(date -d "+90 days" +%F)
          python qingan.py --version
          python qingan.py init /tmp/qingan-study --exam-date "$exam_date" --daily-hours 4
          python qingan.py subject add /tmp/qingan-study --name 数学 --max-score 150 --baseline 70 --target 110 --kind calculation
          python qingan.py plan /tmp/qingan-study
          python qingan.py today /tmp/qingan-study
