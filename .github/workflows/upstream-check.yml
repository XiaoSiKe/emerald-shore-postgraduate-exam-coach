name: Upstream source check

on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate read-only report
        id: upstream
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_upstreams.py > upstream-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-report
          path: upstream-report.json
          retention-days: 30
